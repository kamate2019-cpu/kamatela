<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kamatelaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="#0D1117" />
  
  <!-- Outer glowing ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#kamatelaGrad)" stroke-width="6" opacity="0.4" />

  <!-- Super App Emblem: WhatsApp Chat Bubble merged with TikTok Play note and Business Crown -->
  <g filter="url(#shadow)">
    <!-- Chat Bubble Body (WhatsApp style) -->
    <path d="M140 130 C140 90, 372 90, 372 130 L372 280 C372 320, 310 350, 240 350 L190 395 C180 405, 160 395, 165 375 L175 350 C145 345, 140 320, 140 280 Z" 
          fill="url(#kamatelaGrad)" />
    
    <!-- Video Play triangle & TikTok Music Wave fusion -->
    <path d="M215 185 L325 245 L215 305 Z" fill="#FFFFFF" />

    <!-- Musical/Stream Wave floating badge (TikTok vibe) -->
    <circle cx="370" cy="150" r="42" fill="url(#accentGrad)" />
    <path d="M360 136 L360 162 M372 130 L372 168 M384 140 L384 158" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Business Crown / Star Sparkle (Business Hub vibe) -->
    <polygon points="175,125 182,142 199,142 185,153 190,170 175,160 160,170 165,153 151,142 168,142" fill="#FCD34D" />
  </g>

  <!-- Letter K monogram in playhead -->
  <text x="256" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#E2E8F0" text-anchor="middle" letter-spacing="8">KAMATELA</text>
</svg>
